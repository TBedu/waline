name: Build Waline image

on:
  push:
  pull_request:

jobs:
  build:
    name: Build Waline image
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      
      - name: Set Docker image tag
        id: set-tag
        run: |
          SHORT_SHA=${{ github.sha }}
          SHORT_SHA=${SHORT_SHA:0:7}  # 获取Git提交哈希的简写
          echo "IMAGE_NAME=waline" >> $GITHUB_OUTPUT
          echo "TAGS=crpi-5gaavsu26u802w5w.cn-hangzhou.personal.cr.aliyuncs.com/tbedu/waline:$SHORT_SHA" >> $GITHUB_OUTPUT

      - name: Set up Docker QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Check for required secrets
        shell: bash
        run: |
          echo "Checking if ALIYUN secrets are provided..."
          if [ -z "${{ secrets.ALIYUN_USERNAME }}" ]; then
            echo "Error: ALIYUN_USERNAME secret is required"
            exit 1
          fi
          if [ -z "${{ secrets.ALIYUN_PASSWORD }}" ]; then
            echo "Error: ALIYUN_PASSWORD secret is required"
            exit 1
          fi
          echo "Secrets are provided"
          echo "Registry: crpi-5gaavsu26u802w5w.cn-hangzhou.personal.cr.aliyuncs.com"

      - name: Login to Aliyun Container Registry
        uses: docker/login-action@v3
        with:
          registry: crpi-5gaavsu26u802w5w.cn-hangzhou.personal.cr.aliyuncs.com
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}

      - name: Build and push Waline image
        uses: docker/build-push-action@v6.14.0
        with:
          context: .
          file: waline/Dockerfile
          push: true
          tags: ${{ steps.set-tag.outputs.TAGS }}
          platforms: linux/amd64