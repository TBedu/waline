name: Build Waline image

on:
  push:
  pull_request:

jobs:
  build:
    name: Build Waline image
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      
      - name: Read version from VERSION.txt
        id: version
        run: |
          VERSION=$(cat VERSION.txt)
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          
      - name: Set Docker image tag
        id: set-tag
        run: |
          SHORT_SHA=${{ github.sha }}
          SHORT_SHA=${SHORT_SHA:0:7}  # 获取Git提交哈希的简写
          echo "IMAGE_NAME=waline" >> $GITHUB_OUTPUT
          echo "TAGS=crpi-5gaavsu26u802w5w.cn-hangzhou.personal.cr.aliyuncs.com/tbedu/waline:${{ steps.version.outputs.VERSION }},crpi-5gaavsu26u802w5w.cn-hangzhou.personal.cr.aliyuncs.com/tbedu/waline:$SHORT_SHA" >> $GITHUB_OUTPUT

      - name: Set up Docker QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Aliyun Container Registry
        uses: docker/login-action@v3
        with:
          registry: crpi-5gaavsu26u802w5w.cn-hangzhou.personal.cr.aliyuncs.com
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}

      - name: Build and push Waline image
        uses: docker/build-push-action@v6.14.0
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.set-tag.outputs.TAGS }}
          platforms: linux/amd64,linux/arm64/v8,linux/arm/v7